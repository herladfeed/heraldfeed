<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:white;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
display:none;
justify-content:center;
align-items:center;
z-index:5000;
}

.popup-content{
background:white;
padding:40px;
width:90%;
max-width:420px;
text-align:center;
position:relative;
animation:popupFade 0.3s ease;
}

.popup-content h2{
font-size:28px;
letter-spacing:3px;
margin-bottom:15px;
}

.popup-content p{
font-size:15px;
color:#666;
margin-bottom:25px;
}

.popup-content input{
width:100%;
padding:14px;
border:1px solid #ddd;
margin-bottom:15px;
font-size:15px;
}

.subscribe-btn{
width:100%;
padding:14px;
background:black;
color:white;
border:none;
font-size:15px;
cursor:pointer;
}

#close-popup{
position:absolute;
top:10px;
right:15px;
background:none;
border:none;
font-size:28px;
cursor:pointer;
}

@keyframes popupFade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
/* NAVBAR */

nav{
width:100%;
padding:25px 50px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #e5e5e5;
background:white;
position:sticky;
top:0;
z-index:1000;
}

.nav-links{
display:flex;
align-items:center;
gap:30px;
}

.nav-links a{
text-decoration:none;
color:black;
font-size:16px;
transition:0.2s;
}

.nav-links a:hover{
opacity:0.6;
}

/* MENU */

.menu-button{
background:none;
border:none;
font-size:28px;
cursor:pointer;
}

.side-menu{
position:fixed;
top:0;
left:-320px;
width:260px;
height:100vh;
background:white;
border-right:1px solid #e5e5e5;
box-shadow:4px 0 20px rgba(0,0,0,0.08);
padding:30px 25px;
z-index:2000;
transition:0.3s ease;
}

.side-menu.show{
left:0;
}

.side-menu h3{
margin-bottom:15px;
font-size:16px;
letter-spacing:1px;
}

.side-menu label{
display:block;
margin-bottom:12px;
font-size:14px;
cursor:pointer;
}

.side-menu input{
margin-right:8px;
}

.side-menu hr{
margin:25px 0;
border:none;
border-top:1px solid #e5e5e5;
}

/* HERO */

.hero{
text-align:center;
padding:60px 20px 30px;
}

.hero h1{
font-size:48px;
letter-spacing:4px;
margin-bottom:10px;
}

.hero p{
color:#666;
}

/* GRID */

.grid{
width:95%;
max-width:1600px;
margin:auto;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:20px;
padding-bottom:60px;
}

.product{
position:relative;
display:block;
}

.product img{
width:100%;
height:350px;
object-fit:cover;
transition:0.3s ease;
display:block;
}

.product img:hover{
transform:scale(1.03);
}

/* SALE BADGE */

.sale-badge{
position:absolute;
top:10px;
left:10px;
background:black;
color:white;
font-size:12px;
letter-spacing:1px;
padding:6px 10px;
z-index:10;
}

/* MOBILE */

@media(max-width:1000px){
.grid{
grid-template-columns:repeat(3,1fr);
}
}

@media(max-width:700px){

nav{
padding:20px;
}

.grid{
grid-template-columns:repeat(2,1fr);
}

.hero h1{
font-size:34px;
}

}
</style>
</head>

<body>

<nav>

<button id="menu-button" class="menu-button">☰</button>

<div class="nav-links">
<a href="mens.html">Men's</a>
<a href="womens.html">Women's</a>
<a href="sales.html">Sale</a>
</div>

</nav>

<div id="side-menu" class="side-menu">

<h3>Filter Brands</h3>

<label><input type="checkbox" value="BBC"> BBC</label>
<label><input type="checkbox" value="BAPE"> BAPE</label>
<label><input type="checkbox" value="Motel Rocks"> Motel Rocks</label>
<label><input type="checkbox" value="Hollister"> Hollister</label>
<label><input type="checkbox" value="Urban Outfitters"> Urban Outfitters</label>
<label><input type="checkbox" value="YEEZY"> YEEZY</label>
<label><input type="checkbox" value="Carhartt"> Carhartt</label>

<hr>

</div>

<section class="hero">
<h1>NEW DROPS</h1>
<p>Curated streetwear releases updated daily.</p>
</section>

<section class="grid" id="product-grid"></section>

<script src="products.js"></script>

<script>
const grid = document.getElementById("product-grid");
const menuButton = document.getElementById("menu-button");
const sideMenu = document.getElementById("side-menu");
const checkboxes = document.querySelectorAll(".side-menu input");

menuButton.addEventListener("click", (event) => {
event.stopPropagation();
sideMenu.classList.toggle("show");
});

document.addEventListener("click", (event) => {
if (
sideMenu.classList.contains("show") &&
!sideMenu.contains(event.target) &&
event.target !== menuButton
) {
sideMenu.classList.remove("show");
}
});

document.addEventListener("keydown", (event) => {
if (event.key === "Escape") {
sideMenu.classList.remove("show");
}
});

function shuffleProducts(productList){
return [...productList].sort(() => Math.random() - 0.5);
}

function displayProducts(){
grid.innerHTML = "";

const selectedBrands = Array.from(checkboxes)
.filter(box => box.checked)
.map(box => box.value);

let filteredProducts = products;

if(selectedBrands.length > 0){
filteredProducts = products.filter(product =>
selectedBrands.includes(product.brand)
);
}

const shuffledProducts = shuffleProducts(filteredProducts);

shuffledProducts.forEach(product => {
grid.innerHTML += `
<a class="product" href="${product.link}" target="_blank">
${product.sale === true ? '<span class="sale-badge">SALE</span>' : ''}
<img src="${product.image}" onerror="this.parentElement.remove()">
</a>
`;
});
}

checkboxes.forEach(box => {
box.addEventListener("change", displayProducts);
});

displayProducts();


const popup = document.getElementById("email-popup");
const closePopup = document.getElementById("close-popup");

setTimeout(() => {
popup.style.display = "flex";
}, 4000);

closePopup.addEventListener("click", () => {
popup.style.display = "none";
});

</script>

</body>
</html>
